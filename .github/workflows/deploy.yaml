name: Deploy Application

on:
  push:
    branches:
      - main

jobs:

  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

  docker:

    needs: terraform

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t glacierknight/hello-world-devops:latest ./app

      - name: Push Docker Image
        run: |
          docker push glacierknight/hello-world-devops:latest

  deploy:

    needs: docker

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: k8s

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get EC2 Public IP
        id: terraform_output
        working-directory: terraform
        run: |
          echo "EC2_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      - name: Create SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Copy Kubernetes Files
        run: |
          scp -o StrictHostKeyChecking=no -i private_key.pem deployment.yaml service.yaml ubuntu@$EC2_IP:/home/ubuntu/

      - name: Deploy to K3s
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_IP << EOF
            kubectl apply -f /home/ubuntu/deployment.yaml
            kubectl apply -f /home/ubuntu/service.yaml
          EOF
