apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-world-app

  template:
    metadata:
      labels:
        app: hello-world-app

    spec:
      containers:
      - name: hello-world-container
        image: glacierknight/hello-world-devops:latest

        ports:
        - containerPort: 3000